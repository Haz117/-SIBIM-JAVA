name: CI

# Every branch: the work is done on a branch and merged into main only once
# it is green, so running only on main reported a failure after the fact.
on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run tests, enforce coverage gate, and build fat JAR
        run: mvn --batch-mode --no-transfer-progress verify

      # The installed PCs connect as sibim_app (scripts/sql/rol_app_minimo.sql:
      # no DDL, RLS on every table): the database tests once more, as that role.
      - name: Integration tests as sibim_app
        run: mvn --batch-mode --no-transfer-progress test "-Dtest=com.sibim.db.integration.*Test" "-Dsurefire.failIfNoSpecifiedTests=false" "-Djacoco.skip=true" "-Dsibim.it.comoApp=true"

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: surefire-reports-${{ github.sha }}
          path: target/surefire-reports/
          retention-days: 14

      - name: Upload fat JAR
        uses: actions/upload-artifact@v7
        with:
          name: sibim-desktop-jar-${{ github.sha }}
          path: target/sibim-desktop-*.jar
          if-no-files-found: error
          retention-days: 7
