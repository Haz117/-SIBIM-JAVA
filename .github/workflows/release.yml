name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build installers & publish release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Strip leading 'v' from tag (v1.2.3 → 1.2.3)
      - name: Extract version
        id: ver
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          echo "version=$v" >> $env:GITHUB_OUTPUT
          echo "tag=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT

      # WiX 3.x is required by jpackage --type exe/msi on JDK 21
      - name: Install WiX 3.x
        shell: pwsh
        run: choco install wixtoolset --yes --no-progress

      - name: Stamp version in pom.xml
        run: mvn --batch-mode versions:set -DnewVersion=${{ steps.ver.outputs.version }} -DgenerateBackupPoms=false

      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports-${{ steps.ver.outputs.version }}
          path: target/surefire-reports/
          retention-days: 30

      - name: Build fat JAR
        run: mvn --batch-mode --no-transfer-progress package -DskipTests

      # ── Portable ZIP (app-image, no installer needed) ─────────────────────────
      - name: Create portable app-image
        shell: pwsh
        run: |
          $version = '${{ steps.ver.outputs.version }}'
          $jar = Get-ChildItem target -Filter "sibim-desktop-*.jar" |
                 Where-Object { $_.Name -notlike "*original*" } |
                 Sort-Object LastWriteTime -Descending |
                 Select-Object -First 1
          Write-Host "Fat JAR: $($jar.Name)"

          $iconArg = @()
          if (Test-Path "src\main\resources\img\icon.ico") {
            $iconArg = "--icon", "src\main\resources\img\icon.ico"
          }

          New-Item -ItemType Directory -Force -Path "packaging\dist" | Out-Null

          & "$env:JAVA_HOME\bin\jpackage.exe" `
            --type        app-image `
            --name        "SIBIM Desktop" `
            --app-version $version `
            --vendor      "H. Ayuntamiento Municipal" `
            --description "Sistema Integral de Bienes Municipales" `
            --input       target `
            --main-jar    $jar.Name `
            --main-class  com.sibim.Main `
            --dest        "packaging\dist" `
            --java-options "-Xmx512m" `
            --java-options "-Dfile.encoding=UTF-8" `
            @iconArg

          if ($LASTEXITCODE -ne 0) { throw "jpackage (app-image) failed with exit $LASTEXITCODE" }

          $src = "packaging\dist\SIBIM Desktop"
          $zip = "packaging\dist\SIBIM-Desktop-$version-win64-portable.zip"
          Compress-Archive -Path $src -DestinationPath $zip -CompressionLevel Optimal
          $size = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host "Portable zip: $zip ($size MB)"

      # ── EXE installer (requires WiX 3.x installed above) ─────────────────────
      - name: Create .exe installer
        shell: pwsh
        run: |
          $version = '${{ steps.ver.outputs.version }}'
          $jar = Get-ChildItem target -Filter "sibim-desktop-*.jar" |
                 Where-Object { $_.Name -notlike "*original*" } |
                 Sort-Object LastWriteTime -Descending |
                 Select-Object -First 1

          # WiX adds itself to machine PATH — refresh it so jpackage can find candle.exe / light.exe
          $env:PATH = [System.Environment]::GetEnvironmentVariable("PATH", "Machine") + ";" + $env:PATH

          $iconArg = @()
          if (Test-Path "src\main\resources\img\icon.ico") {
            $iconArg = "--icon", "src\main\resources\img\icon.ico"
          }

          & "$env:JAVA_HOME\bin\jpackage.exe" `
            --type        exe `
            --name        "SIBIM Desktop" `
            --app-version $version `
            --vendor      "H. Ayuntamiento Municipal" `
            --description "Sistema Integral de Bienes Municipales" `
            --input       target `
            --main-jar    $jar.Name `
            --main-class  com.sibim.Main `
            --dest        "packaging\dist" `
            --java-options "-Xmx512m" `
            --java-options "-Dfile.encoding=UTF-8" `
            --win-menu `
            --win-shortcut `
            --win-dir-chooser `
            @iconArg

          if ($LASTEXITCODE -ne 0) { throw "jpackage (exe) failed with exit $LASTEXITCODE" }

          $exe = Get-ChildItem "packaging\dist" -Filter "SIBIM Desktop-*.exe" | Select-Object -First 1
          $size = [math]::Round($exe.Length / 1MB, 1)
          Write-Host "Installer: $($exe.FullName) ($size MB)"

          # Rename to a consistent artifact name without spaces
          $clean = "packaging\dist\SIBIM-Desktop-$version-win64-setup.exe"
          Rename-Item $exe.FullName $clean
          Write-Host "Renamed to: $clean"

      # ── Publish GitHub Release with both artifacts ─────────────────────────
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: SIBIM Desktop ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            packaging/dist/SIBIM-Desktop-*-portable.zip
            packaging/dist/SIBIM-Desktop-*-setup.exe
          fail_on_unmatched_files: true
